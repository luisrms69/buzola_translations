name: CI

on:
  push:
    branches:
      - version-16
  pull_request:

concurrency:
  group: ci-buzola_translations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Build and install app (flit) + tooling
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install ruff pyyaml mkdocs mkdocs-material

      - name: Import Python package
        run: python -c "import buzola_translations; print('buzola_translations', buzola_translations.__version__)"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Validate TOML and YAML config
        run: |
          python -c "import tomllib, yaml, glob; tomllib.load(open('pyproject.toml','rb')); [yaml.safe_load(open(f)) for f in ['mkdocs.yml', '.pre-commit-config.yaml', *glob.glob('.github/workflows/*.yml')]]; print('config files parse OK')"

      - name: MkDocs strict build
        run: mkdocs build --strict

      - name: No forbidden artifacts tracked
        run: |
          if git ls-files | grep -E '(^|/)__pycache__/|\.pyc$|\.mo$|(^|/)site/'; then
            echo "::error::Forbidden artifact tracked in repository"
            exit 1
          fi
          echo "No forbidden artifacts tracked"
